---
# =============================================================================
# Honeynet — Fluent Bit Log Forwarder
#
# Installs and configures Fluent Bit on honeypot nodes to ship Cowrie JSON
# logs directly to the centralized S3 log sink.
#
# Fluent Bit has a native S3 output plugin — lightweight, cloud-native,
# industry standard for exactly this use case.
#
# Usage:
#   ansible-playbook -i inventory.ini ansible/playbooks/install_log_forwarder.yml \
#     -e "s3_bucket=honeynet-threat-log-sink aws_region=us-east-1 telemetry_sensor_id=aws-us-east-1"
# =============================================================================

- name: Install and configure Fluent Bit log forwarder
  hosts: honeynet
  become: true

  vars:
    cowrie_log_path: "/home/ubuntu/cowrie/var/log/cowrie/cowrie.json"
    sensor_name: "{{ telemetry_sensor_id | default(inventory_hostname) }}"
    aws_region: "{{ aws_region | default('us-east-1') }}"
    s3_bucket: "{{ s3_bucket }}"

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Add Fluent Bit signing key
      shell: |
        set -euo pipefail
        curl -fsSL https://packages.fluentbit.io/fluentbit.key | gpg --dearmor -o /usr/share/keyrings/fluentbit-keyring.gpg
      args:
        creates: /usr/share/keyrings/fluentbit-keyring.gpg
        executable: /bin/bash


    - name: Add Fluent Bit apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/fluentbit-keyring.gpg] https://packages.fluentbit.io/ubuntu/{{ ansible_distribution_release }} {{ ansible_distribution_release }} main"
        state: present
        filename: fluent-bit

    - name: Install Fluent Bit
      apt:
        name: fluent-bit
        state: present
        update_cache: true

    - name: Deploy Fluent Bit configuration
      template:
        src: ../templates/fluent-bit.conf.j2
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Fluent Bit

    - name: Enable and start Fluent Bit
      systemd:
        name: fluent-bit
        enabled: true
        state: started

  handlers:
    - name: Restart Fluent Bit
      systemd:
        name: fluent-bit
        state: restarted
