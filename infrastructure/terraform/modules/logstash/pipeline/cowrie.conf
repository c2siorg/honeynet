input {
  beats {
    port => 5044
  }
}

filter {
  # Parse Cowrie JSON logs
  json {
    source => "message"
  }
  
  # Add GeoIP enrichment
  geoip {
    source => "srcip"
    target => "geoip"
  }
  
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Extract key fields
  mutate {
    add_field => {
      "log_type" => "honeypot"
      "sensor_type" => "cowrie"
      "environment" => "production"
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
    template_name => "honeypot"
    template_pattern => "honeypot-*"
    template_overwrite => true
  }
}
